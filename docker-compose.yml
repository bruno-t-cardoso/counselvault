# Local development stack. Credentials here are throwaway dev values.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counselvault -d counselvault"]
      interval: 2s
      timeout: 3s
      retries: 30
  s3:
    # Local stand-in for AWS S3 (moto server), for development and tests.
    image: motoserver/moto
  app:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    environment:
      DB_HOST: db
      S3_ENDPOINT_URL: http://s3:5000
      S3_BUCKET: counselvault-dev
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started
