# Local development stack. Credentials here are throwaway dev values.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
      - ./docker/allow-replication.sh:/docker-entrypoint-initdb.d/allow-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counselvault_owner -d counselvault"]
      interval: 2s
      timeout: 3s
      retries: 30
  replica:
    # Optional read replica, kept in sync by streaming replication.
    # Start with: DB_REPLICA_HOST=replica docker compose --profile replica up
    image: postgres:16
    profiles: ["replica"]
    user: postgres
    command:
      - bash
      - -c
      - |
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          pg_basebackup -D "$$PGDATA" -R -X stream \
            -d "host=db user=replicator password=replicator-dev-password"
          chmod 700 "$$PGDATA"
        fi
        exec postgres
    depends_on:
      db:
        condition: service_healthy
  s3:
    # Local stand-in for AWS S3 (moto server), for development and tests.
    image: motoserver/moto
  worker:
    # Reads S3 upload events from SQS and extracts text for search.
    build: .
    command: sh -c "python manage.py setup_local_aws && python manage.py consume_uploads"
    volumes:
      - .:/app
    environment: &app_env
      DJANGO_DEBUG: "1"
      DB_HOST: db
      DB_REPLICA_HOST: ${DB_REPLICA_HOST:-}
      S3_ENDPOINT_URL: http://s3:5000
      S3_BUCKET: counselvault-dev
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started
  app:
    build: .
    command: sh -c "python manage.py migrate --database owner && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    environment: *app_env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started
